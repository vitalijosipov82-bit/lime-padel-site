  <style>
    :root {
      color-scheme: dark;
      font-family: Manrope, Arial, sans-serif;
      background: #0a1115;
      color: #fff;
      --accent: #d9f36b;
      --gutter: clamp(24px, 5.2vw, 168px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body, h1, p, dl, dd { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
    .visually-hidden, .skip:not(:focus) {
      position: absolute; width: 1px; height: 1px; padding: 0;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }
    .skip:focus { position: fixed; z-index: 5; top: 12px; left: 12px; padding: 12px; background: #0a1115; }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      padding-inline: max(var(--gutter), env(safe-area-inset-left)) max(var(--gutter), env(safe-area-inset-right));
      overflow: clip;
    }

    .film, .film::after, .shot { position: absolute; inset: 0; }
    .film { z-index: -1; overflow: hidden; background: #111c23; }
    .shot { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 63% 47%; }
    .shot[data-frame="1"] { object-position: 60% 50%; }
    .shot[data-frame="2"] { object-position: 61% 48%; }
    .film::after {
      content: "";
      pointer-events: none;
      background:
        linear-gradient(0deg, rgba(3, 8, 11, .76), rgba(3, 8, 11, .30) 19%, transparent 47%),
        linear-gradient(180deg, rgba(3, 8, 11, .49), transparent 22%),
        linear-gradient(90deg, rgba(3, 8, 11, .70) 0%, rgba(3, 8, 11, .42) 29%, transparent 68%);
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding-top: max(clamp(18px, 4.4vh, 68px), env(safe-area-inset-top));
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      white-space: nowrap;
    }
    .brand img { display: block; width: 37px; height: auto; }

    .location-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .location-link svg { width: 12px; height: 12px; color: var(--accent); }

    .composition {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      align-content: center;
      column-gap: 20px;
      padding-block: clamp(38px, 9vh, 156px) clamp(35px, 4vh, 90px);
    }
    .story { min-width: 0; }
    .eyebrow {
      margin-bottom: clamp(14px, 2.1vh, 38px);
      color: #fff;
      font-size: clamp(10px, .88vw, 19px);
      font-weight: 700;
      letter-spacing: .20em;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .wordmark {
      margin-inline-start: -.054em;
      color: #fff;
      font-size: clamp(86px, 17vw, 610px);
      font-weight: 900;
      letter-spacing: -.07em;
      line-height: .90;
      white-space: nowrap;
    }
    .description {
      max-width: 29ch;
      margin-top: clamp(18px, 2.7vh, 55px);
      font-size: clamp(14px, 1.12vw, 25px);
      font-weight: 500;
      line-height: 1.48;
      text-wrap: balance;
    }

    .booking {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(24px, 3vw, 65px);
      min-height: 44px;
      margin-top: clamp(14px, 2.5vh, 45px);
      font-size: clamp(14px, 1.05vw, 24px);
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .booking::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 1px;
      background: var(--accent);
      transform-origin: left;
      transition: transform .32s cubic-bezier(.2, .7, .2, 1);
    }
    .booking svg {
      width: 1em;
      height: 1em;
      color: var(--accent);
      transition: transform .32s cubic-bezier(.2, .7, .2, 1);
    }
    @media (hover: hover) {
      .booking:hover svg { transform: translate(3px, -3px); }
      .booking:hover::after { transform: scaleX(.72); }
      .location-link:hover, .contacts a:hover, .reel button:hover { color: var(--accent); }
    }

    .reel {
      grid-column: 2;
      display: flex;
      align-items: center;
      align-self: end;
      gap: 9px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .07em;
    }
    .frame-number { min-width: 4.3ch; white-space: nowrap; }
    .reel button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .reel button + button { margin-left: -9px; }
    .reel svg { width: 15px; height: 15px; }
    .meter { width: clamp(22px, 4vw, 85px); height: 1px; background: #ffffff55; overflow: hidden; }
    .meter > span { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }

    .contacts {
      display: flex;
      align-items: center;
      padding-block: clamp(18px, 3.3vh, 54px) max(clamp(22px, 4.1vh, 64px), env(safe-area-inset-bottom));
      border-top: 1px solid #ffffff33;
      font-size: clamp(12px, .91vw, 20px);
      font-weight: 500;
      line-height: 1.5;
      scroll-margin-block: 20px;
    }
    .contacts > * + * { border-left: 1px solid #ffffff33; }
    .contacts > * { padding-inline: clamp(15px, 2.25vw, 64px); }
    .contacts > :first-child { padding-left: 0; }
    .contacts > :last-child { padding-right: 0; }
    .contacts address { font-style: normal; }
    .contacts a, .contacts time { white-space: nowrap; }

    @media (max-width: 700px) {
      .film::after {
        background:
          linear-gradient(0deg, rgba(3, 8, 11, .86), rgba(3, 8, 11, .63) 29%, rgba(3, 8, 11, .31) 58%, transparent 82%),
          linear-gradient(180deg, rgba(3, 8, 11, .57), transparent 24%);
      }
      .shot { object-position: 65% 37%; }
      .shot[data-frame="1"] { object-position: 61% 50%; }
      .shot[data-frame="2"] { object-position: 57% 45%; }
      .composition {
        grid-template-columns: minmax(0, 1fr);
        align-content: end;
        row-gap: 7px;
        padding-block: clamp(70px, 20svh, 230px) 8px;
      }
      .wordmark { font-size: clamp(76px, 22.5vw, 155px); }
      .description { text-wrap: initial; }
      .reel { grid-column: 1; justify-self: end; margin-right: -10px; }
      .contacts {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        row-gap: 9px;
        padding-block-start: 13px;
        font-size: 12px;
      }
      .contacts > * { padding-inline: 0; }
      .contacts > address { grid-column: 1 / -1; }
      .contacts > .hours { border-left: 0; padding-right: 9px; }
      .contacts > a { padding-left: 10px; }
    }

    @media (max-width: 350px) {
      :root { --gutter: 17px; }
      .wordmark { font-size: 73px; }
      .contacts { font-size: 11px; }
    }

    @media (max-height: 540px) and (min-width: 701px) {
      .composition { padding-block: 24px; }
      .wordmark { font-size: clamp(76px, 24vh, 160px); }
      .description, .booking { margin-top: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .booking::after, .booking svg { transition: none; }
      .meter { visibility: hidden; }
    }
  </style>
</head>
