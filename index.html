<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Падел-клуб ЛАЙМ · Казань</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style-dist.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>
<a class="hero-skip sr-only" href="#main">К основному содержимому</a>

<main id="main" tabindex="-1">
  <section id="hero" aria-labelledby="hero-title"
    class="relative isolate block w-full min-h-[100svh] bg-[#101a17] text-[#f5f1e7]">

    <figure id="hero-media" aria-label="Фотографии клуба"
      class="absolute inset-0 z-0 m-0 w-full overflow-hidden">
      <div id="hero-matte" class="absolute inset-0">
        <div class="hero-shot absolute inset-0" data-shot="0">
          <img
            src="on-court-1440.webp" srcset="on-court-768.webp 768w, on-court-1440.webp 1440w, on-court-1920.webp 1920w"
            sizes="100vw" width="1440" height="960" fetchpriority="high" decoding="async"
            alt="Спортсменка с ракеткой на синем корте клуба «Лайм»"
            class="absolute inset-0 block h-full w-full object-cover object-[68%_36%]">
        </div>
      </div>
      <span id="hero-shade" aria-hidden="true"
        class="pointer-events-none absolute inset-0 z-10"></span>
      <svg id="hero-cut" aria-hidden="true" hidden
        class="pointer-events-none absolute inset-0 z-20 block h-full w-full">
        <path fill="none" stroke="#d9f36b" stroke-width="1.5"
          vector-effect="non-scaling-stroke"></path>
      </svg>
    </figure>

    <header id="hero-head"
      class="absolute inset-x-[var(--edge)] top-[clamp(14px,2.4svh,28px)] z-50 block">
      <a href="#hero" aria-label="Лайм Падел" class="hero-logo inline-block min-h-11">
        <picture>
          <source media="(max-width: 767px)" srcset="./images/logo/lime-padel-logo-mark-800.png">
          <img src="./images/logo/lime-padel-logo-1000.png" alt="" width="454" height="560"
            class="block h-auto w-[48px] md:w-[72px]">
        </picture>
      </a>
      <a href="#hero-address"
        class="hero-route absolute right-0 top-0 inline-block min-h-11 py-3 text-sm font-bold underline underline-offset-4">
        Как добраться
      </a>
    </header>

    <div id="hero-copy"
      class="absolute left-[var(--edge)] top-[23%] z-30 block w-[calc(100%_-_2*var(--edge))]">
      <h1 id="hero-title" class="m-0">
        <span class="hero-line block overflow-hidden">
          <span data-intro-line
            class="hero-kicker block font-bold uppercase leading-[1.25] tracking-[.12em]">
            Падел-клуб
          </span>
        </span>
        <span class="hero-line hero-line--name block overflow-hidden">
          <strong data-intro-line
            class="hero-name block text-[clamp(8rem,17.2vw,20rem)] font-[800] leading-[.94] tracking-[-.065em]">
            ЛАЙМ
          </strong>
        </span>
      </h1>
      <p class="hero-lead m-0 max-w-[30ch] text-[clamp(1rem,1.45vw,1.375rem)] leading-[1.42]">
        Играйте с друзьями или начните с тренером.
      </p>
    </div>

    <a id="hero-book" href="https://n1437757.yclients.ru/company/1301052/record-type?o="
      class="absolute bottom-[var(--action-bottom)] left-[calc(var(--edge)_+_24px)] z-40 block min-h-14 border-b-2 border-[#d9f36b] py-4 pr-14 text-lg font-bold">
      <span>Забронировать корт</span>
      <svg class="absolute right-1 top-1/2 h-6 w-6" aria-hidden="true"
        width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </a>

    <div id="hero-controls" role="group" aria-label="Управление фотографиями"
      class="absolute bottom-[var(--action-bottom)] right-[var(--edge)] z-40 text-right text-sm" hidden>
      <button type="button" data-frame-toggle aria-controls="hero-media"
        class="inline-block min-h-11 px-2 underline underline-offset-4">Пауза</button>
      <button type="button" data-frame-next aria-controls="hero-media"
        class="inline-block min-h-11 px-2 underline underline-offset-4">Следующий кадр</button>
      <span class="hero-sr-only" role="status" data-frame-status></span>
    </div>

    <footer id="hero-address" tabindex="-1"
      class="absolute inset-x-[var(--edge)] bottom-[24px] z-40 block border-t border-[#f5f1e7]/40 pt-3">
      <p class="hero-place">Казань · ТЦ «Франт», 3-й этаж</p>
      <address class="hero-street">ул. Юлиуса Фучика, 90</address>
      <div id="hero-hours">
        <p>Ежедневно · 08:00–23:00</p>
        <a href="tel:+79027112003">8 (902) 711-20-03</a>
      </div>
    </footer>
  </section>
</main>



<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="script.js"></script>

<script>
  (() => {
    const hasLocalFile = (selector, attribute, name) =>
      Array.from(document.querySelectorAll(selector)).some(node =>
        new URL(node.getAttribute(attribute), document.baseURI).pathname.endsWith('/' + name)
      );

    if (!hasLocalFile('script[src]', 'src', 'script.js')) {
      const script = document.createElement('script');
      script.src = './script.js';
      document.body.append(script);
    }
  })();
</script>
</body>
</html>
