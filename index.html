<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Падел-клуб ЛАЙМ · Казань</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style-dist.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#101a17] font-['Montserrat',sans-serif]">
<a class="hero-skip sr-only" href="#main">К основному содержимому</a>

<main id="main" tabindex="-1">
  <section id="hero" aria-labelledby="hero-title"
    class="relative isolate block w-full min-h-[100svh] bg-[#101a17] text-[#f5f1e7] overflow-hidden">

    <!-- Фоновое медиа-пространство -->
    <figure id="hero-media" aria-label="Фотографии клуба"
      class="absolute inset-0 z-0 m-0 w-full h-full overflow-hidden">
      <div id="hero-matte" class="absolute inset-0">
        <div class="hero-shot absolute inset-0" data-shot="0">
          <img
            src="on-court-1440.webp" srcset="on-court-1440.webp 1400w"
            sizes="100vw" width="1440" height="960" fetchpriority="high" decoding="async"
            alt="Спортсменка с ракеткой на синем корте клуба «Лайм»"
            class="absolute inset-0 block h-full w-full object-cover object-[68%_36%]">
        </div>
      </div>
      <span id="hero-shade" aria-hidden="true"
        class="pointer-events-none absolute inset-0 z-10 bg-black/40"></span>
      <svg id="hero-cut" aria-hidden="true" hidden
        class="pointer-events-none absolute inset-0 z-20 block h-full w-full">
        <path fill="none" stroke="#d9f36b" stroke-width="1.5"
          vector-effect="non-scaling-stroke"></path>
      </svg>
    </figure>

    <!-- Исправленная безопасная Flexbox-шапка без absolute наложений -->
    <header id="hero-head"
      class="absolute inset-x-0 top-0 z-50 flex items-center justify-between px-6 py-4 md:px-12 md:py-6">
      <a href="#hero" aria-label="Лайм Падел" class="hero-logo flex items-center font-bold text-xl tracking-wider text-[#d9f36b]">
        ЛАЙМ ПАДЕЛ
      </a>
      <a href="#hero-address"
        class="hero-route inline-block py-2 text-sm font-bold underline underline-offset-4 hover:text-[#d9f36b] transition-colors">
        Как добраться
      </a>
    </header>

    <!-- Контентный блок -->
    <div id="hero-copy"
      class="absolute left-6 md:left-12 top-[28%] z-30 block max-w-xl">
      <h1 id="hero-title" class="m-0">
        <span class="hero-line block overflow-hidden">
          <span data-intro-line
            class="hero-kicker block font-bold uppercase leading-[1.25] tracking-[.12em] text-sm md:text-base text-[#d9f36b]">
            Падел-клуб
          </span>
        </span>
        <span class="hero-line hero-line--name block overflow-hidden">
          <strong data-intro-line
            class="hero-name block text-[clamp(4.5rem,12vw,12rem)] font-[800] leading-[.94] tracking-[-.065em]">
            ЛАЙМ
          </strong>
        </span>
      </h1>
      <p class="hero-lead m-0 mt-4 max-w-[30ch] text-[clamp(1rem,1.45vw,1.375rem)] leading-[1.42] opacity-90">
        Играйте с друзьями или начните с тренером.
      </p>
    </div>

    <!-- Кнопка бронирования с фиксированным безопасным отступом снизу -->
    <a id="hero-book" href="https://n1437757.yclients.ru/company/1301052/record-type?o="
      class="absolute bottom-36 md:bottom-28 left-6 md:left-12 z-40 flex items-center border-b-2 border-[#d9f36b] pb-3 pr-14 text-lg font-bold hover:text-[#d9f36b] transition-colors">
      <span>Забронировать корт</span>
      <svg class="absolute right-1 top-1/2 -translate-y-1/2 h-6 w-6" aria-hidden="true"
        width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </a>

    <div id="hero-controls" role="group" aria-label="Управление фотографиями"
      class="absolute bottom-36 md:bottom-28 right-6 md:right-12 z-40 text-right text-sm" hidden>
      <button type="button" data-frame-toggle aria-controls="hero-media"
        class="inline-block min-h-11 px-2 underline underline-offset-4">Пауза</button>
      <button type="button" data-frame-next aria-controls="hero-media"
        class="inline-block min-h-11 px-2 underline underline-offset-4">Следующий кадр</button>
      <span class="hero-sr-only" role="status" data-frame-status></span>
    </div>

    <!-- Подвал страницы -->
    <footer id="hero-address" tabindex="-1"
      class="absolute inset-x-6 md:inset-x-12 bottom-6 z-40 block border-t border-[#f5f1e7]/20 pt-4 flex flex-col md:flex-row md:items-center md:justify-between gap-2 text-sm opacity-80">
      <div class="flex flex-col md:flex-row md:gap-4">
        <p class="hero-place font-bold">Казань · ТЦ «Франт», 3-й этаж</p>
        <address class="hero-street not-italic">ул. Юлиуса Фучика, 90</address>
      </div>
      <div id="hero-hours" class="flex items-center gap-4">
        <p>Ежедневно · 08:00–23:00</p>
        <a href="tel:+79027112003" class="font-bold hover:text-[#d9f36b] underline underline-offset-2">8 (902) 711-20-03</a>
      </div>
    </footer>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
